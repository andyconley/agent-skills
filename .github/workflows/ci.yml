name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Check shell syntax
        run: bash -n install.sh scripts/*.sh tests/*.sh
      - name: Validate skills
        run: ./scripts/validate-skills.sh
      - name: Test installer
        run: ./tests/install-test.sh
      - name: Lint prose
        uses: vale-cli/vale-action@v3
        with:
          config: tools/vale/.vale.ini
          files: '["README.md","CONTRIBUTING.md","CODE_OF_CONDUCT.md","SECURITY.md","docs","skills","shared","examples","tests/manual"]'
          fail_on_error: true
