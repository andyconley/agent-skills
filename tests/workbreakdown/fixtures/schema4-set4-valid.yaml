      precedent:
        searched: [src/transport, docs/design]
        verdict: none
    fields:
      summary: Choose the state transport
      done_when: The transport decision is recorded and reviewed.
      description:
        question: Which transport carries state reads within the payload limit?
        precedent:
          searched: [src/transport, docs/design]
          verdict: none
