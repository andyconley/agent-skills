schema_version: 4
manifest_id: schema4-full
revision: 1
template_set:
  id: jira-house-templates
  version: 2
scope:
  parent_key: INIT-1
  epic_key: EPIC-1
epic:
  disposition: update
  template_id: jira-epic-v2
  template_sha256: 18fefffa6ebb6fe385616ecc0dce1756a6238ce11cd5f41d972557313d42342e
  expected_current:
    description_adf_sha256: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
  changes:
    description:
      milestone_outcome: Consumers retrieve current state through the supported API.
      problem: The current interface does not expose a supported state representation.
      acceptance_criteria:
        - condition: A permitted consumer retrieves current state.
          evidence: Passing functional-test report.
          acceptor: API owner
        - condition: Stale data is identified.
          evidence: Passing stale-data scenario.
          acceptor: Service owner
        - condition: Unsupported sources return the documented error.
          evidence: Passing error-contract scenario.
          acceptor: Support owner
      success_measures:
        - Supported consumers complete state reads within the service target.
shaping:
  spike_shape:
    value: vertical-slice
    source: reused
    from_epic: EPIC-2
  task_granularity:
    value: per-flow
    source: asked
  reviewers:
    value:
      - API owner
    source: asked
  source_order:
    value:
      - jira-amendment
      - design-page
    source: default
sources:
  jira_context: present
  existing_children:
    - jira_key: WORK-301
      read:
        - description
        - amendments
        - status
        - links
        - link_history
  conflicts:
    - claim: State reads use the cached projection.
      sources:
        - ref: docs/design/state.md
          date: "2026-01-10"
        - ref: WORK-301
          date: "2026-02-03"
      winner: WORK-301
      material: true
      stale: true
children:
  - ref: build-endpoint
    type: Task
    template_id: jira-task-v2
    template_sha256: fedfeda541933a2a379bf7569703b138e078aa9ee730438a839977824bdd06b3
    disposition: proposed
    classification:
      precedent:
        searched:
          - src/api/handlers
        verdict: found
        location: src/api/handlers/status.rb
    fields:
      summary: Add the supported state endpoint
      done_when: The endpoint returns current state for every supported source.
      description:
        result: A supported read endpoint returns current system state.
        context: Consumers have no supported way to read current state.
        acceptance_criteria:
          - The endpoint returns current state for a permitted consumer.
          - An unsupported source returns the documented error.
        validation: Passing endpoint contract test in the representative system.
        constraints: The endpoint reuses the existing authorization filter.
  - ref: choose-transport
    type: Spike
    variant: design
    template_id: jira-spike-design-v2
    template_sha256: 5b936d0a1ad0bbf705e446fa921234ee9818f17a79df79e99c2a55e47491aff5
    disposition: proposed
    classification:
      question: Which transport carries state reads within the payload limit?
      precedent:
        searched:
          - src/transport
          - docs/design
        verdict: none
    fields:
      summary: Choose the state transport
      done_when: The transport decision is recorded and reviewed.
      description:
        decision: Select the transport for state reads.
        questions_and_constraints:
          - Does the existing gateway support the required payload size?
        design_artifact: docs/design/state-transport.md
        reviewers:
          - API owner
        checklist_coverage: Interface and capacity concerns apply. Storage concerns are excluded.
        done_when:
          - The decision is recorded with evidence and reviewer disposition.
        downstream_updates:
          - The endpoint Task estimate is revised.
  - ref: measure-staleness
    type: Spike
    variant: investigation
    template_id: jira-spike-investigation-v2
    template_sha256: 988d1188e66b2afe7932b5dc6be0da2f29af51b62cff483df91855056fb7e960
    disposition: proposed
    classification:
      question: How stale is the current state under normal load?
      precedent:
        searched:
          - docs/runbooks
        verdict: unverified
    fields:
      summary: Measure state staleness
      done_when: The observed staleness range is recorded.
      description:
        question: How stale is the current state under normal load?
        evidence_needed:
          - Sampled measurement across a representative window.
        done_when:
          - The observed range, confidence, and recommendation are recorded.
        downstream_updates:
          - The acceptance threshold for the endpoint Task is confirmed.
        boundaries:
          - Production tuning is out of scope.
dependencies:
  - action: ensure
    blocker: {jira_key: WORK-410}
    blocked: {ref: build-endpoint}
rank:
  mode: scoped-relative
  order: [choose-transport, measure-staleness, build-endpoint]
unknowns: []
consolidation:
  status: run
  claims:
    - claim: "The cached projection owns state reads."
      claimed_by: [EPIC-1, EPIC-2]
      owner: EPIC-1
      rationale: "EPIC-1 builds the projection, and EPIC-2 only reads it."
      confirmation:
        state: confirmed
        confirmed_by: "Program lead"
        evidence: "Planning review notes, 2026-09-20"
    - claim: "Retry policy for stale reads."
      claimed_by: [EPIC-1, EPIC-3]
      owner: EPIC-3
      rationale: "EPIC-3 owns the client retry layer."
      confirmation:
        state: proposed
  order:
    source: rank
    value: [EPIC-0, EPIC-1, EPIC-2, EPIC-3]
  exceptions:
    - blocker: WORK-410
      blocked: build-endpoint
      blocker_epic: EPIC-3
      blocked_epic: EPIC-1
      reason: "The later milestone's load fixture must exist before the endpoint is tested."
      approver: "Program lead"
      approval_evidence: "Decision log entry, 2026-09-18"
